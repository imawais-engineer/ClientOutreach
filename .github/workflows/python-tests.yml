name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  job-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test the job discovery engine
        run: |
          python -m pip install -e "./job_discovery[dev]"
          python -m pytest -q job_discovery/tests
