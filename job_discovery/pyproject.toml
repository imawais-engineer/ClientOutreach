[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-discovery"
version = "0.1.0"
description = "Config-driven job discovery engine ported from the n8n fetch, detail, and scoring workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
job-discovery = "job_discovery.cli:main"

[tool.setuptools.packages.find]
include = ["job_discovery*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
